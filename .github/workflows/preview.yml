name: Prévisualisation PR

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Installation des dépendances
        run: npm ci
      
      - name: Build du projet
        run: npm run build
      
      - name: Upload du build
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: ./dist
          retention-days: 7
      
      - name: Commentaire sur la PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const runId = context.runId;
            const repoUrl = context.payload.repository.html_url;
            
            const comment = `## 🚀 Build de prévisualisation prêt !
            
            ✅ Le build a été créé avec succès pour cette PR.
            
            ### Options pour tester en ligne :
            
            1. **GitHub Pages (branche)** : Vous pouvez déployer cette branche sur GitHub Pages
               - Fusionnez cette PR dans une branche de test
               - GitHub Pages déploiera automatiquement
            
            2. **Netlify Drop** : Téléchargez l'artifact et déployez sur Netlify
               - Téléchargez l'artifact depuis [Actions](${repoUrl}/actions/runs/${runId})
               - Allez sur [drop.netlify.com](https://drop.netlify.com)
               - Glissez-déposez le dossier \`dist\`
            
            3. **Local** : Testez localement
               \`\`\`bash
               git checkout ${context.payload.pull_request.head.ref}
               npm install
               npm run dev
               \`\`\`
            
            ### 📸 Aperçu des modifications
            
            Cette PR ajoute :
            - ✅ Navigation entre deux pages
            - ✅ Page "Est-ce le 18 du mois ?" (fonctionnalité existante)
            - ✅ Page "Temps ensemble" (nouvelle page)
            `;
            
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
