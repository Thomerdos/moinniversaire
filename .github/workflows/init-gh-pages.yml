name: Initialiser gh-pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Créer la branche gh-pages
        run: |
          # Créer une branche orpheline (sans historique)
          git checkout --orphan gh-pages
          
          # Supprimer tous les fichiers du working directory
          git rm -rf .
          
          # Créer un fichier index.html de base
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Moinniversaire - Previews</title>
            <style>
              body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                max-width: 800px;
                margin: 50px auto;
                padding: 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
              }
              .container {
                background: white;
                padding: 40px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
              }
              h1 {
                color: #667eea;
                margin-bottom: 20px;
              }
              p {
                color: #666;
                line-height: 1.6;
              }
              a {
                color: #667eea;
                text-decoration: none;
                font-weight: bold;
              }
              a:hover {
                text-decoration: underline;
              }
              .emoji {
                font-size: 3rem;
                margin: 20px 0;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="emoji">🎉</div>
              <h1>Moinniversaire - GitHub Pages</h1>
              <p>Cette page sert de base pour le déploiement sur GitHub Pages.</p>
              <p>Les previews des Pull Requests seront disponibles dans des sous-dossiers :</p>
              <ul>
                <li><code>/pr-1/</code> pour la PR #1</li>
                <li><code>/pr-2/</code> pour la PR #2</li>
                <li>etc.</li>
              </ul>
              <p>Le site principal est déployé depuis la branche <code>main</code>.</p>
              <hr style="margin: 30px 0; border: none; border-top: 1px solid #ddd;">
              <p style="text-align: center; color: #999;">
                🔗 <a href="https://github.com/Thomerdos/moinniversaire">Voir le repository</a>
              </p>
            </div>
          </body>
          </html>
          EOF
          
          # Ajouter le fichier
          git add index.html
          
          # Configurer git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Committer
          git commit -m "Initialize gh-pages branch"
          
          # Pousser la branche
          git push origin gh-pages
      
      - name: Succès
        run: |
          echo "✅ Branche gh-pages créée avec succès !"
          echo "Vous pouvez maintenant configurer GitHub Pages dans Settings > Pages"
          echo "Sélectionnez la branche 'gh-pages' et le dossier '/ (root)'"
