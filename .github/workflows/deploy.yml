name: Déploiement sur GitHub Pages

on:
  # Déclenche le workflow sur les push vers la branche main
  push:
    branches: ['main']
  
  # Permet de déclencher manuellement le workflow depuis l'onglet Actions
  workflow_dispatch:

# Définit les permissions nécessaires pour déployer sur GitHub Pages
permissions:
  contents: write

# Permet un seul déploiement concurrent
concurrency:
  group: 'pages-deploy'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Installation des dépendances
        run: npm ci
      
      - name: Build du projet
        run: npm run build
      
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true
      
      - name: Initialiser gh-pages si nécessaire
        run: |
          if [ ! -d "gh-pages/.git" ]; then
            echo "La branche gh-pages n'existe pas, création..."
            mkdir -p gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
            
            # Créer un fichier .nojekyll
            touch .nojekyll
            
            # Créer un README
            cat > README.md << 'EOF'
          # Moinniversaire - GitHub Pages
          
          Ce dossier contient les déploiements GitHub Pages :
          - `/` : Version de production (branche main)
          - `/pr-X/` : Previews des Pull Requests
          EOF
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Initialize gh-pages branch"
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push -u origin gh-pages
            cd ..
          else
            echo "Branche gh-pages existe déjà"
          fi
      
      - name: Déployer sur gh-pages (racine)
        run: |
          cd gh-pages
          
          # Supprimer tous les fichiers sauf les dossiers pr-* et quelques fichiers spéciaux
          find . -maxdepth 1 -type f ! -name '.nojekyll' ! -name 'README.md' ! -name 'CNAME' -delete
          find . -maxdepth 1 -type d ! -name '.' ! -name '..' ! -name '.git' ! -name 'pr-*' -exec rm -rf {} +
          
          # Copier le nouveau build à la racine
          cp -r ../dist/* .
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy main branch to GitHub Pages" || echo "No changes to commit"
          git push origin gh-pages
      
      - name: Résumé du déploiement
        run: |
          echo "✅ Déploiement réussi !"
          echo "🔗 URL de production : https://${{ github.repository_owner }}.github.io/moinniversaire/"
